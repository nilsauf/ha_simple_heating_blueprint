blueprint:
  name: Simple Heating
  domain: automation
  description: >
    Simple heating automation with weekly schedules, Comfort/Eco modes and
    an optional heating-off period. Controls a thermostat via an input_select
    and automatically switches temperature and HVAC mode based on a timer.
  homeassistant:
    min_version: 2025.4.0

  input:
    thermostat:
      name: Thermostat
      description: Climate entity that will be controlled by this automation.
      selector:
        entity:
          domain: climate
    state_helper:
      name: Comfort/Eco/Off State Selector
      description: >
        Input select used to control the heating mode.
        Must contain the options: Comfort, Eco and Off.
        Manual changes are applied immediately.
      selector:
        entity:
          domain: input_select
    plan_timer:
      name: Plan Timer
      description: >
        Timer used internally to schedule the next mode change.
        The timer will be started automatically.
        You can pause the timer to disable automatic mode change.
        Time will be recalculated on restart.
      selector:
        entity:
          domain: timer
    heat_temp:
      name: Heating Temperature (Comfort)
      description: Target temperature when Comfort mode is active.
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
    eco_temp:
      name: Eco Temperature
      description: Target temperature when Eco mode is active.
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
    off_start:
      name: Heating-Free Period - Start Date
      description: >
        Start date of the heating-off period.
        During this time the heating will be forced to Off mode.
        Year will be ignored, the date will apply to all years.
        Leave start or end empty to disable the heating-off period.
      default: ""
      selector:
        date:
    off_end:
      name: Heating-Free Period - End Date
      description: >
        End date of the heating-off period.
        Heating resumes automatically after this date.
        Year will be ignored, the date will apply to all years.
        Leave start or end empty to disable the heating-off period.
      default: ""
      selector:
        date:
    monday:
      name: Monday
      description: >
        Comfort time ranges for this day.
        Each entry defines a start and end time during which
        Comfort mode is active. Outside these ranges, Eco mode is used.
        Leave empty to use Eco mode all day.
      default: []
      selector:
        object:
          label_field: start
          description_field: end
          multiple: true
          fields:
            start:
              label: Start
              required: true
              selector:
                time:
            end:
              label: End
              required: true
              selector:
                time:
    tuesday:
      name: Tuesday
      description: >
        Comfort time ranges for this day.
        Each entry defines a start and end time during which
        Comfort mode is active. Outside these ranges, Eco mode is used.
        Leave empty to use Eco mode all day.
      default: []
      selector:
        object:
          label_field: start
          description_field: end
          multiple: true
          fields:
            start:
              label: Start
              required: true
              selector:
                time:
            end:
              label: End
              required: true
              selector:
                time:
    wednesday:
      name: Wednesday
      description: >
        Comfort time ranges for this day.
        Each entry defines a start and end time during which
        Comfort mode is active. Outside these ranges, Eco mode is used.
        Leave empty to use Eco mode all day.
      default: []
      selector:
        object:
          label_field: start
          description_field: end
          multiple: true
          fields:
            start:
              label: Start
              required: true
              selector:
                time:
            end:
              label: End
              required: true
              selector:
                time:
    thursday:
      name: Thursday
      description: >
        Comfort time ranges for this day.
        Each entry defines a start and end time during which
        Comfort mode is active. Outside these ranges, Eco mode is used.
        Leave empty to use Eco mode all day.
      default: []
      selector:
        object:
          label_field: start
          description_field: end
          multiple: true
          fields:
            start:
              label: Start
              required: true
              selector:
                time:
            end:
              label: End
              required: true
              selector:
                time:
    friday:
      name: Friday
      description: >
        Comfort time ranges for this day.
        Each entry defines a start and end time during which
        Comfort mode is active. Outside these ranges, Eco mode is used.
        Leave empty to use Eco mode all day.
      default: []
      selector:
        object:
          label_field: start
          description_field: end
          multiple: true
          fields:
            start:
              label: Start
              required: true
              selector:
                time:
            end:
              label: End
              required: true
              selector:

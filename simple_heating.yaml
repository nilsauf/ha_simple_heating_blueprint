blueprint:
  name: Simple Heating
  domain: automation
  source_url: https://github.com/nilsauf/ha_simple_heating_blueprint/blob/main/simple_heating.yaml
  description: >
    Simple heating automation with weekly schedules, Comfort/Eco modes and
    an optional heating-off period. Controls a thermostat via an input_select
    and automatically switches temperature and HVAC mode based on a timer.
  homeassistant:
    min_version: 2025.4.0

  input:
    thermostat:
      name: Thermostat
      description: Climate entity that will be controlled by this automation.
      selector:
        entity:
          domain: climate
    state_helper:
      name: Comfort/Eco/Off State Selector
      description: >
        Input select used to control the heating mode.
        Must contain the options: Comfort, Eco and Off.
        Manual changes are applied immediately.
      selector:
        entity:
          domain: input_select
    plan_timer:
      name: Plan Timer
      description: >
        Timer used internally to schedule the next mode change.
        The timer will be started automatically.
        You can pause the timer to disable automatic mode change.
        Time will be recalculated on restart.
      selector:
        entity:
          domain: timer
    heat_temp:
      name: Heating Temperature (Comfort)
      description: Target temperature when Comfort mode is active.
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
    eco_temp:
      name: Eco Temperature
      description: Target temperature when Eco mode is active.
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
    off_start:
      name: Heating-Free Period - Start Date
      description: >
        Start date of the heating-off period.
        During this time the heating will be forced to Off mode.
        Year will be ignored, the date will apply to all years.
        Leave start or end empty to disable the heating-off period.
      default: ""
      selector:
        date:
    off_end:
      name: Heating-Free Period - End Date
      description: >
        End date of the heating-off period.
        Heating resumes automatically after this date.
        Year will be ignored, the date will apply to all years.
        Leave start or end empty to disable the heating-off period.
      default: ""
      selector:
        date:
    monday:
      name: Monday
      <<: &weekday_schedule
        description: >
          Comfort time ranges for this day.
          Each entry defines a start and end time during which
          Comfort mode is active. Outside these ranges, Eco mode is used.
          Leave empty to use Eco mode all day.
        default: []
        selector:
          object:
            label_field: start
            description_field: end
            multiple: true
            fields:
              start:
                label: Start
                required: true
                selector:
                  time:
              end:
                label: End
                required: true
                selector:
                  time:
    tuesday:
      name: Tuesday
      <<: *weekday_schedule
    wednesday:
      name: Wednesday
      <<: *weekday_schedule
    thursday:
      name: Thursday
      <<: *weekday_schedule
    friday:
      name: Friday
      <<: *weekday_schedule
    saturday:
      name: Saturday
      <<: *weekday_schedule
    sunday:
      name: Sunday
      <<: *weekday_schedule

mode: queued

variables:
  thermostat: !input thermostat
  state_helper: !input state_helper
  plan_timer: !input plan_timer
  heat_temp: !input heat_temp
  eco_temp: !input eco_temp
  off_start: !input off_start
  off_end: !input off_end
  weekday_schedules:
    mon: !input monday
    tue: !input tuesday
    wed: !input wednesday
    thu: !input thursday
    fri: !input friday
    sat: !input saturday
    sun: !input sunday

triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input plan_timer
    id: timer_finished
  - trigger: event
    event_type: timer.restarted
    event_data:
      entity_id: !input plan_timer
    id: timer_restarted
  - trigger: state
    entity_id: !input state_helper
    to:
      - Comfort
      - Eco
      - "Off"
    id: state_changed
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: event
    event_type: automation_reloaded
    id: automation_reloaded

conditions:
  # Only kick off the schedule on start/reload if the timer chain is broken
  - condition: or
    conditions:
      - condition: not
        conditions:
          - condition: trigger
            id:
              - ha_start
              - automation_reloaded
      - condition: state
        entity_id: !input plan_timer
        state: idle

actions:
  ######################################################################
  # State helper → control thermostat
  ######################################################################
  - if:
      - condition: trigger
        id:
          - state_changed
    then:
      - variables:
          mode: "{{ trigger.to_state.state }}"
          current_mode: "{{ states(thermostat) }}"
          current_temp: "{{ state_attr(thermostat, 'temperature') }}"
          desired_temp: "{{ heat_temp if mode == 'Comfort' else eco_temp }}"
      - if:
          - "{{ mode == 'Off' }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ thermostat }}"
            data:
              hvac_mode: "off"
        else:
          - if:
              - "{{ current_mode != 'heat' }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ thermostat }}"
                data:
                  hvac_mode: "heat"
          - if:
              - "{{ current_temp != desired_temp }}"
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ thermostat }}"
                data:
                  temperature: "{{ desired_temp }}"

    ######################################################################
    # Schedule → set state helper
    ######################################################################
    else:
      - variables:
          now_ts: "{{ now() | as_timestamp | int }}"
          # Boundaries are the next local 00:00 strictly after now of the start
          # day and of the day after the (inclusive) end day. A missing Feb 29
          # starts the period on Mar 1 and ends it after Feb 28.
          # Active iff the next end comes before the next start. If both coincide,
          # the period covers the whole year (end is the day before start),
          # unless it is Feb 29 to Feb 29 in a non-leap year, which is empty.
          off_period: >
            {%- macro next_boundary_ts(date, is_end) -%}
            {%- set md = date.split('-')[1:] | map('int') | list -%}
            {%- set ns = namespace(ts=[]) -%}
            {%- for y in [now().year, now().year + 1] -%}
              {%- set leap = (y % 4 == 0 and y % 100 != 0) or y % 400 == 0 -%}
              {%- if md == [2, 29] and (is_end or not leap) -%}
                {%- set b = today_at('00:00').replace(year=y, month=3, day=1) -%}
              {%- else -%}
                {%- set b = today_at('00:00').replace(year=y, month=md[0], day=md[1]) + timedelta(days=1 if is_end else 0) -%}
              {%- endif -%}
              {%- set ns.ts = ns.ts + [b | as_timestamp | int] -%}
            {%- endfor -%}
            {{ ns.ts | select('>', now_ts) | min }}
            {%- endmacro -%}
            {%- if off_start is string and off_start != '' and off_end is string and off_end != '' -%}
              {%- set next_start = next_boundary_ts(off_start, false) | int -%}
              {%- set next_end = next_boundary_ts(off_end, true) | int -%}
              {%- set whole_year = next_end == next_start and off_start.split('-')[1:] != off_end.split('-')[1:] -%}
              {{ {'active': next_end < next_start or whole_year, 'next_change_ts': [next_start, next_end] | min} }}
            {%- else -%}
              {{ {'active': false, 'next_change_ts': none} }}
            {%- endif -%}
          weekday_keys: "{{ ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'] }}"
          weekday_key: "{{ weekday_keys[now().weekday()] }}"
          next_weekday_key: "{{ weekday_keys[(now().weekday() + 1) % 7] }}"
          current_plan: "{{ weekday_schedules[weekday_key] }}"
          next_plan: "{{ weekday_schedules[next_weekday_key] }}"
          desired_mode: Eco
          comfort_starts: >
            {%- set ns = namespace(tomorrow=[]) -%}
            {%- for item in next_plan -%}
              {%- set ns.tomorrow = ns.tomorrow + [(today_at(item.start) + timedelta(days=1)) | as_timestamp | int] -%}
            {%- endfor -%}
            {{
              (
                current_plan
                | map(attribute='start')
                | map('today_at')
                | map('as_timestamp')
                | map('int')
                | list
              )
              + ns.tomorrow
            }}
          comfort_ends: >
            {{
              current_plan
              | map(attribute='end')
              | map('today_at')
              | map('as_timestamp')
              | map('int')
              | list
            }}
      - if:
          - "{{ off_period.active }}"
        then:
          - variables:
              desired_mode: "Off"
        else:
          - repeat:
              for_each: "{{ current_plan }}"
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: >
                            {{ today_at(repeat.item.start) <= now() <= today_at(repeat.item.end) }}
                      sequence:
                        - variables:
                            desired_mode: Comfort
      - variables:
          # Daily re-evaluation; guarantees selected_list is never empty.
          midnight_ts: "{{ (today_at('00:00') + timedelta(days=1)) | as_timestamp | int }}"
          selected_list: >
            {{
              (comfort_ends if desired_mode == 'Comfort' else comfort_starts if desired_mode == 'Eco' else [])
              + ([off_period.next_change_ts] if off_period.next_change_ts is not none else [])
              + [midnight_ts]
            }}
          next_duration: >
            {{
              (
                (selected_list
                | select('>', now_ts)
                | sort
                | first
                | as_datetime
                | as_local
                ) - now()
              ).total_seconds() + 1
            }}

      - action: timer.cancel
        target:
          entity_id: "{{ plan_timer }}"
      - action: timer.start
        target:
          entity_id: "{{ plan_timer }}"
        data:
          duration: "{{ next_duration }}"
      - if:
          - condition: not
            conditions:
              - condition: trigger
                id:
                  - timer_restarted
        then:
          - action: input_select.select_option
            target:
              entity_id: "{{ state_helper }}"
            data:
              option: "{{ desired_mode }}"

blueprint:
  name: Simple Heating
  domain: automation
  source_url: https://github.com/nilsauf/ha_simple_heating_blueprint/blob/main/simple_heating.yaml
  description: >
    Simple heating automation with weekly schedules, Comfort/Eco modes and
    an optional heating-off period. Controls a thermostat via an input_select
    and automatically switches temperature and HVAC mode based on a timer.
  homeassistant:
    min_version: 2025.4.0

  input:
    thermostat:
      name: Thermostat
      description: Climate entity that will be controlled by this automation.
      selector:
        entity:
          domain: climate
    state_helper:
      name: Comfort/Eco/Off State Selector
      description: >
        Input select used to control the heating mode.
        Must contain the options: Comfort, Eco and Off.
        Manual changes are applied immediately and kept until the
        schedule's mode next changes. A Home Assistant restart reapplies
        the schedule.
      selector:
        entity:
          domain: input_select
    plan_timer:
      name: Plan Timer
      description: >
        Timer used internally to schedule the next mode change.
        The timer will be started automatically.
        You can pause the timer to disable automatic mode change.
        Time will be recalculated on restart.
      selector:
        entity:
          domain: timer
    heat_temp:
      name: Heating Temperature (Comfort)
      description: Target temperature when Comfort mode is active.
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
    eco_temp:
      name: Eco Temperature
      description: Target temperature when Eco mode is active.
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
    off_start:
      name: Heating-Free Period - Start Date
      description: >
        Start date of the heating-off period.
        During this time the heating will be forced to Off mode.
        Year will be ignored, the date will apply to all years.
        Leave start or end empty to disable the heating-off period.
      default: ""
      selector:
        date:
    off_end:
      name: Heating-Free Period - End Date
      description: >
        End date of the heating-off period.
        Heating resumes automatically after this date.
        Year will be ignored, the date will apply to all years.
        Leave start or end empty to disable the heating-off period.
      default: ""
      selector:
        date:
    monday:
      name: Monday
      <<: &weekday_schedule
        description: >
          Comfort time ranges for this day.
          Each entry defines a start and end time during which
          Comfort mode is active. Outside these ranges, Eco mode is used.
          The start is inclusive, the end exclusive. An end at or before
          the start ends on the next day (e.g. 22:00-02:00, or 00:00-00:00
          for the whole day). Overlapping ranges are merged.
          Leave empty to use Eco mode all day.
        default: []
        selector:
          object:
            label_field: start
            description_field: end
            multiple: true
            fields:
              start:
                label: Start
                required: true
                selector:
                  time:
              end:
                label: End
                required: true
                selector:
                  time:
    tuesday:
      name: Tuesday
      <<: *weekday_schedule
    wednesday:
      name: Wednesday
      <<: *weekday_schedule
    thursday:
      name: Thursday
      <<: *weekday_schedule
    friday:
      name: Friday
      <<: *weekday_schedule
    saturday:
      name: Saturday
      <<: *weekday_schedule
    sunday:
      name: Sunday
      <<: *weekday_schedule

mode: queued

variables:
  thermostat: !input thermostat
  state_helper: !input state_helper
  plan_timer: !input plan_timer
  heat_temp: !input heat_temp
  eco_temp: !input eco_temp
  off_start: !input off_start
  off_end: !input off_end
  weekday_schedules:
    mon: !input monday
    tue: !input tuesday
    wed: !input wednesday
    thu: !input thursday
    fri: !input friday
    sat: !input saturday
    sun: !input sunday

triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: !input plan_timer
    id: timer_finished
  - trigger: event
    event_type: timer.restarted
    event_data:
      entity_id: !input plan_timer
    id: timer_restarted
  - trigger: state
    entity_id: !input state_helper
    to:
      - Comfort
      - Eco
      - "Off"
    id: state_changed
  - trigger: homeassistant
    event: start
    id: ha_start
  - trigger: event
    event_type: automation_reloaded
    id: automation_reloaded

conditions:
  # On start, only kick off the schedule if the timer chain is broken.
  # On reload, also recalculate a running timer (the schedule may have been
  # edited). A paused timer is left alone.
  - condition: or
    conditions:
      - condition: not
        conditions:
          - condition: trigger
            id:
              - ha_start
              - automation_reloaded
      - condition: state
        entity_id: !input plan_timer
        state: idle
      - condition: and
        conditions:
          - condition: trigger
            id: automation_reloaded
          - condition: state
            entity_id: !input plan_timer
            state: active

actions:
  ######################################################################
  # State helper → control thermostat
  ######################################################################
  - if:
      - condition: trigger
        id:
          - state_changed
    then:
      - variables:
          mode: "{{ trigger.to_state.state }}"
          current_mode: "{{ states(thermostat) }}"
          current_temp: "{{ state_attr(thermostat, 'temperature') }}"
          desired_temp: "{{ heat_temp if mode == 'Comfort' else eco_temp }}"
      - if:
          - "{{ mode == 'Off' }}"
        then:
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ thermostat }}"
            data:
              hvac_mode: "off"
        else:
          - if:
              - "{{ current_mode != 'heat' }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ thermostat }}"
                data:
                  hvac_mode: "heat"
          - if:
              - "{{ current_temp != desired_temp }}"
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ thermostat }}"
                data:
                  temperature: "{{ desired_temp }}"

    ######################################################################
    # Schedule → set state helper
    ######################################################################
    else:
      - variables:
          now_ts: "{{ now() | as_timestamp | int }}"
          # Mode resolver. resolve(t) returns "<mode> <next_change_ts>" for any
          # timestamp t, using only t (never now()), so it can be evaluated for
          # both now and the moment the state helper last changed. A
          # next_change_ts of 0 means the mode never changes.
          #
          # Off period: boundaries are the next local 00:00 strictly after t of
          # the start day and of the day after the (inclusive) end day. A missing
          # Feb 29 starts the period on Mar 1 and ends it after Feb 28.
          # Active iff the next end comes before the next start. If both coincide,
          # the period covers the whole year (end is the day before start),
          # unless it is Feb 29 to Feb 29 in a non-leap year, which is empty.
          #
          # Comfort: ranges of the day before t (they may still run), t's day
          # and the following 7 days (day 7 is t's weekday next week), start
          # inclusive, end exclusive. An end at or before the start (by wall
          # clock) is on the next day, so 00:00-00:00 and 08:00-08:00 are 24 h.
          # A range that is empty after a DST change (e.g. 02:30-03:15 on the
          # night the clocks go forward) never activates Comfort, but its start
          # stays a candidate, so a schedule with only such a range still has a
          # next change.
          # Overlapping or adjacent ranges are merged, also across days, so the
          # next change while in Comfort is the end of the merged block and
          # while in Eco the next Comfort start.
          #
          # Off beats Comfort beats Eco.
          schedule: >
            {%- macro local_ts(t, hms, days) -%}
            {%- set p = (hms ~ ':0:0').split(':') | map('int') | list -%}
            {{ ((t | as_datetime | as_local).replace(hour=p[0], minute=p[1], second=p[2], microsecond=0, fold=0) + timedelta(days=days)) | as_timestamp | int }}
            {%- endmacro -%}
            {%- macro off_boundary(t, date, is_end) -%}
            {%- set md = date.split('-')[1:] | map('int') | list -%}
            {%- set base = (t | as_datetime | as_local).replace(hour=0, minute=0, second=0, microsecond=0, fold=0) -%}
            {%- set ns = namespace(ts=[]) -%}
            {%- for y in [base.year, base.year + 1] -%}
              {%- set leap = (y % 4 == 0 and y % 100 != 0) or y % 400 == 0 -%}
              {%- if md == [2, 29] and (is_end or not leap) -%}
                {%- set b = base.replace(year=y, month=3, day=1) -%}
              {%- else -%}
                {%- set b = base.replace(year=y, month=md[0], day=md[1]) + timedelta(days=1 if is_end else 0) -%}
              {%- endif -%}
              {%- set ns.ts = ns.ts + [b | as_timestamp | int] -%}
            {%- endfor -%}
            {{ ns.ts | select('>', t) | min }}
            {%- endmacro -%}
            {%- macro resolve(t) -%}
            {%- set ns = namespace(off_active=false, candidates=[], ranges=[], starts=[], block_end=t) -%}
            {%- if off_start is string and off_start != '' and off_end is string and off_end != '' -%}
              {%- set next_start = off_boundary(t, off_start, false) | int -%}
              {%- set next_end = off_boundary(t, off_end, true) | int -%}
              {%- set whole_year = next_end == next_start and off_start.split('-')[1:] != off_end.split('-')[1:] -%}
              {%- set ns.off_active = next_end < next_start or whole_year -%}
              {%- set ns.candidates = ns.candidates + [[next_start, next_end] | min] -%}
            {%- endif -%}
            {%- for d in range(-1, 8) -%}
              {%- set weekday = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][((t | as_datetime | as_local) + timedelta(days=d)).weekday()] -%}
              {%- for item in weekday_schedules[weekday] -%}
                {%- set s = local_ts(t, item.start, d) | int -%}
                {%- set crosses = ((item.end ~ ':0:0').split(':')[:3] | map('int') | list) <= ((item.start ~ ':0:0').split(':')[:3] | map('int') | list) -%}
                {%- set e = local_ts(t, item.end, d + (1 if crosses else 0)) | int -%}
                {%- if e > s -%}
                  {%- set ns.ranges = ns.ranges + [[s, e]] -%}
                {%- endif -%}
                {%- if s > t -%}
                  {%- set ns.starts = ns.starts + [s] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {%- for r in ns.ranges | sort -%}
              {%- if r[0] <= ns.block_end and r[1] > ns.block_end -%}
                {%- set ns.block_end = r[1] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if ns.off_active -%}
              {%- set mode = 'Off' -%}
            {%- elif ns.block_end > t -%}
              {%- set mode = 'Comfort' -%}
              {%- set ns.candidates = ns.candidates + [ns.block_end] -%}
            {%- else -%}
              {%- set mode = 'Eco' -%}
              {%- set ns.candidates = ns.candidates + ns.starts -%}
            {%- endif -%}
            {{ mode }} {{ ns.candidates | select('>', t) | min | default(0) }}
            {%- endmacro -%}
            {%- set current = resolve(now_ts).split() -%}
            {%- set previous = resolve(as_timestamp(states[state_helper].last_changed, now_ts) | int).split() -%}
            {{ {'mode': current[0], 'previous_mode': previous[0], 'next_change_ts': current[1] | int} }}
          # The timer chain was broken (HA start or reload with an idle timer):
          # reapply the schedule unconditionally.
          force_write: >
            {{ trigger.id in ['ha_start', 'automation_reloaded'] and is_state(plan_timer, 'idle') }}

      - action: timer.cancel
        target:
          entity_id: "{{ plan_timer }}"
      # Without a next change (no Comfort ranges and no off period) the timer
      # stays idle until HA start or an automation reload.
      - if:
          - "{{ schedule.next_change_ts > 0 }}"
        then:
          - action: timer.start
            target:
              entity_id: "{{ plan_timer }}"
            data:
              duration: "{{ schedule.next_change_ts - now_ts + 1 }}"
      # Only write when the schedule's mode changed since the state helper last
      # changed, so manual overrides last until the next real mode change.
      - if:
          - "{{ force_write or schedule.mode != schedule.previous_mode }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: "{{ state_helper }}"
            data:
              option: "{{ schedule.mode }}"
